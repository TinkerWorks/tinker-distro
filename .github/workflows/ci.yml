name: distro

on:
  # daily 06:00 UTC, as the Jenkins pipeline
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

# never run two builds at once
concurrency:
  group: distro-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: tinkerworks
    timeout-minutes: 1100
    # the job container sees all 32 host cores; an uncapped 32-way make
    # (chromium in particular) would OOM the 62Gi host
    env:
      BB_NUMBER_THREADS: "8"
      PARALLEL_MAKE: "-j12"
    # bare nix carrier: everything bitbake needs comes from the flake's FHS
    # (nix run .#yocto-fhs, see ci/nix-fhs.sh). The image only has to run
    # nix and provide a shell for the runner's execs.
    container:
      image: nixos/nix:2.34.8
    steps:
      - name: Check
        run: |
          id -u
          nproc
          df -h .
          nix --version

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # keep untracked files (build/: sstate-cache, downloads) between runs;
          # only possible because the runner workspace is a persistent hostPath
          clean: false

      - name: Setup layers
        run: |
          source ci/nix-fhs.sh
          fhs_run '
            source poky/oe-init-build-env build
            # bitbake-layers validates the parse on every addition, so each
            # layer's dependencies must be enabled before it
            bitbake-layers add-layer ../meta-openembedded/meta-oe
            bitbake-layers add-layer ../meta-openembedded/meta-python
            bitbake-layers add-layer ../meta-openembedded/meta-webserver
            bitbake-layers add-layer ../meta-openembedded/meta-networking
            # libcamerasrc (needed by camera-rtsp via meta-tinker's bbappend)
            bitbake-layers add-layer ../meta-openembedded/meta-multimedia
            bitbake-layers add-layer ../meta-raspberrypi
            bitbake-layers add-layer ../meta-rauc
            bitbake-layers add-layer ../meta-rauc-community/meta-rauc-raspberrypi
            bitbake-layers add-layer ../meta-tinker
            bitbake-layers add-layer ../meta-clang
            bitbake-layers add-layer ../meta-browser/meta-chromium
          '

      - name: Build HomeSensorHub
        run: |
          source ci/nix-fhs.sh
          fhs_run '
            source ci/memguard.sh
            source ci/bitbake-heal.sh
            source poky/oe-init-build-env build
            export MACHINE=raspberrypi0-wifi
            export DISTRO=poky-tinker
            bitbake_preclean HomeSensorHub
            memguard_start
            bitbake_heal HomeSensorHub homesensorhub-image homesensorhub-bundle
            memguard_stop
          '

      - name: Build ControlCenter
        run: |
          source ci/nix-fhs.sh
          fhs_run '
            source ci/memguard.sh
            source ci/bitbake-heal.sh
            source poky/oe-init-build-env build
            export MACHINE=raspberrypi-armv8
            export DISTRO=poky-tinker-gui
            bitbake_preclean ControlCenter
            memguard_start
            bitbake_heal ControlCenter controlcenter-image controlcenter-bundle
            memguard_stop
          '

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp build/tmp/deploy/images/*/*.raucb dist/
          cp build/tmp/deploy/images/*/*.root.ext4 dist/
          cp build/tmp/deploy/images/*/*.boot.vfat dist/
          ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: distro-images
          path: dist/
          if-no-files-found: error
